# Development cluster with custom settings

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: otus-demo-dev
nodes:
  - role: control-plane
    image: kindest/node:v1.33.2
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
            system-reserved: memory=100Mi
    extraPortMappings:
      # expose port 80 for HTTP ingress
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      # expose port 443 for HTTPS ingress
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
      # expose port for NodePort services
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
    extraMounts:
      - hostPath: /tmp/kind-data
        containerPath: /data
  - role: worker
    image: kindest/node:v1.33.2
    extraMounts:
      - hostPath: /tmp/kind-data
        containerPath: /data
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
