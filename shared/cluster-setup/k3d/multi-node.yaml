# Multi-node k3d cluster configuration
# See https://k3d.io/v5.8.3/usage/configfile/#all-options-example
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: otus-demo-multi
servers: 1
agents: 3
image: rancher/k3s:v1.33.3-k3s1
ports:
  - port: 6443:6443 # Kubernetes API
options:
  # k3d:
  #   wait: true
  #   timeout: "60s"
  #   disableLoadbalancer: true
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: true
