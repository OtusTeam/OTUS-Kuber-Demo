# Ingress for Harbor: TLS termination for https://harbor.local.
#
# Requirements:
#   minikube addons enable ingress          # ingress-nginx, class "nginx"
#   echo "$(minikube ip) harbor.local" | sudo tee -a /etc/hosts
#
# The certificate (harbor-tls secret) is generated by certs/gen-certs.sh.
# Harbor itself serves plain HTTP behind the ingress (see harbor/values.yaml).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harbor
  namespace: harbor
  annotations:
    # Redirect http -> https
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Unlimit request body size — required for docker push (image layers)
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - harbor.local
      secretName: harbor-tls
  rules:
    - host: harbor.local
      http:
        paths:
          # Single prefix path: Harbor's own nginx (service "harbor") routes
          # / (portal), /api, /v2 (registry), /chartrepo etc. internally.
          - path: /
            pathType: Prefix
            backend:
              service:
                # The frontend service created by the chart
                # (expose.clusterIP.name in harbor/values.yaml)
                name: harbor
                port:
                  number: 80
