<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Kubernetes Data Scraper</title>
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="container mt-5">
            <div class="row">
                <div class="col-md-12">
                    <h1 class="text-center">Kubernetes Data Scraper</h1>
                    <p class="text-center">Current State Information</p>

                    <div class="card mt-4">
                        <div class="card-body">
                            <h5 class="card-title">State Data</h5>
                            <table class="table">
                                <thead>
                                    <th scope="col">Operator</th>
                                    <th scope="col">Version</th>
                                </thead>
                                <tbody>
                                    {% for o,v in state_data.items() %}
                                    <tr>
                                        <th scope="row">{{o}}</th>
                                        <td>{{v}}</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
